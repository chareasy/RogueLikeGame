<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>割草幸存者 MVP</title>
    <style>
      :root {
        --bg0: #070b18;
        --bg1: #102038;
        --accent: #4fd1c5;
        --gold: #ffe66d;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--bg0);
        font-family: "Segoe UI", system-ui, sans-serif;
      }
      body {
        background:
          radial-gradient(1200px 600px at 20% 10%, rgba(79, 209, 197, 0.16), transparent 55%),
          radial-gradient(900px 500px at 85% 80%, rgba(255, 230, 109, 0.1), transparent 50%),
          linear-gradient(160deg, var(--bg0), var(--bg1) 55%, #0b1020);
        animation: bgShift 14s ease-in-out infinite alternate;
      }
      body.in-combat {
        animation: none;
        filter: none;
        /* Quiet chrome so the arena owns attention. */
        background: #050814;
      }
      @keyframes bgShift {
        from {
          filter: hue-rotate(0deg) saturate(1);
        }
        to {
          filter: hue-rotate(12deg) saturate(1.15);
        }
      }
      .stage {
        position: relative;
        width: 100%;
        height: 100%;
        display: grid;
        place-items: center;
      }
      .orb {
        position: absolute;
        width: 180px;
        height: 180px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(79, 209, 197, 0.14), transparent 70%);
        filter: blur(2px);
        pointer-events: none;
        /* Static glow — no drifting chrome around the game. */
        opacity: 0.35;
        transition: opacity 280ms ease;
      }
      .orb.a {
        left: 6%;
        top: 12%;
      }
      .orb.b {
        right: 8%;
        bottom: 10%;
        width: 220px;
        height: 220px;
        background: radial-gradient(circle, rgba(255, 230, 109, 0.1), transparent 70%);
      }
      .orb.c {
        left: 40%;
        bottom: 6%;
        width: 140px;
        height: 140px;
      }
      body.in-combat .orb,
      body.in-combat .motes,
      body.in-combat .corner-gif {
        opacity: 0 !important;
        animation: none !important;
        visibility: hidden;
      }
      @keyframes drift {
        0%,
        100% {
          transform: translate3d(0, 0, 0) scale(1);
          opacity: 0.55;
        }
        50% {
          transform: translate3d(18px, -22px, 0) scale(1.12);
          opacity: 0.9;
        }
      }
      .motes,
      .corner-gif {
        display: none;
      }
      #app {
        position: relative;
        z-index: 2;
        width: min(96vw, 1280px);
        aspect-ratio: 16 / 9;
        max-height: 92vh;
        height: auto;
        box-shadow:
          0 0 0 1px rgba(79, 209, 197, 0.25),
          0 18px 60px rgba(0, 0, 0, 0.55),
          0 0 40px rgba(79, 209, 197, 0.12);
        border-radius: 8px;
        overflow: hidden;
        animation: frameIn 700ms cubic-bezier(0.2, 0.8, 0.2, 1) both;
        transition:
          width 280ms ease,
          max-height 280ms ease,
          border-radius 280ms ease,
          box-shadow 280ms ease;
      }
      body.in-combat #app {
        /* Near-viewport fill — HUD / sprites read larger on desktop. */
        width: min(99.2vw, 1680px);
        max-height: 98.5vh;
        border-radius: 4px;
        box-shadow:
          0 0 0 1px rgba(79, 209, 197, 0.28),
          0 8px 36px rgba(0, 0, 0, 0.7);
      }
      @media (max-width: 720px) {
        #app {
          width: 100vw;
          max-height: 100vh;
          border-radius: 0;
          box-shadow: none;
        }
        body.in-combat #app {
          width: 100vw;
          max-height: 100vh;
          border-radius: 0;
        }
        .orb,
        .motes,
        .corner-gif {
          display: none;
        }
      }
      @keyframes frameIn {
        from {
          opacity: 0;
          transform: translateY(16px) scale(0.985);
        }
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }
      #app canvas {
        display: block;
        width: 100% !important;
        height: 100% !important;
      }
      .corner-gif {
        position: absolute;
        z-index: 3;
        width: 56px;
        height: 56px;
        opacity: 0.7;
        pointer-events: none;
        image-rendering: pixelated;
        transition: opacity 280ms ease;
      }
      .corner-gif.tl {
        left: max(12px, calc(50% - 660px));
        top: 14px;
      }
      .corner-gif.br {
        right: max(12px, calc(50% - 660px));
        bottom: 14px;
      }
    </style>
  </head>
  <body>
    <div class="stage">
      <div class="orb a"></div>
      <div class="orb b"></div>
      <div class="orb c"></div>
      <div class="motes" aria-hidden="true"></div>
      <img class="corner-gif tl" src="assets/ui/fx_xp_orb.gif" alt="" />
      <img class="corner-gif br" src="assets/ui/fx_sparkle.gif" alt="" />
      <div id="app"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
