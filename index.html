<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>割草幸存者 MVP</title>
    <style>
      :root {
        --bg0: #070b18;
        --bg1: #102038;
        --accent: #4fd1c5;
        --gold: #ffe66d;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--bg0);
        font-family: "Segoe UI", system-ui, sans-serif;
      }
      body {
        background:
          radial-gradient(1200px 600px at 20% 10%, rgba(79, 209, 197, 0.16), transparent 55%),
          radial-gradient(900px 500px at 85% 80%, rgba(255, 230, 109, 0.1), transparent 50%),
          linear-gradient(160deg, var(--bg0), var(--bg1) 55%, #0b1020);
        animation: bgShift 14s ease-in-out infinite alternate;
      }
      @keyframes bgShift {
        from {
          filter: hue-rotate(0deg) saturate(1);
        }
        to {
          filter: hue-rotate(12deg) saturate(1.15);
        }
      }
      .stage {
        position: relative;
        width: 100%;
        height: 100%;
        display: grid;
        place-items: center;
      }
      .orb {
        position: absolute;
        width: 180px;
        height: 180px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(79, 209, 197, 0.28), transparent 70%);
        filter: blur(2px);
        pointer-events: none;
        animation: drift 9s ease-in-out infinite;
      }
      .orb.a {
        left: 6%;
        top: 12%;
      }
      .orb.b {
        right: 8%;
        bottom: 10%;
        width: 220px;
        height: 220px;
        background: radial-gradient(circle, rgba(255, 230, 109, 0.18), transparent 70%);
        animation-duration: 11s;
        animation-delay: -3s;
      }
      .orb.c {
        left: 40%;
        bottom: 6%;
        width: 140px;
        height: 140px;
        animation-duration: 7s;
        animation-delay: -1.5s;
      }
      @keyframes drift {
        0%,
        100% {
          transform: translate3d(0, 0, 0) scale(1);
          opacity: 0.55;
        }
        50% {
          transform: translate3d(18px, -22px, 0) scale(1.12);
          opacity: 0.9;
        }
      }
      .motes {
        position: absolute;
        inset: 0;
        pointer-events: none;
        background-image: url("assets/ui/fx_menu_motes.gif"), url("assets/ui/fx_sparkle.gif");
        background-repeat: repeat, no-repeat;
        background-size: 160px 160px, 72px 72px;
        background-position:
          0 0,
          78% 18%;
        opacity: 0.28;
        animation: moteScroll 18s linear infinite;
        mix-blend-mode: screen;
      }
      @keyframes moteScroll {
        from {
          background-position:
            0 0,
            78% 18%;
        }
        to {
          background-position:
            0 -220px,
            76% 22%;
        }
      }
      #app {
        position: relative;
        z-index: 2;
        width: min(100vw, 960px);
        height: min(100vh, 540px);
        box-shadow:
          0 0 0 1px rgba(79, 209, 197, 0.25),
          0 18px 60px rgba(0, 0, 0, 0.55),
          0 0 40px rgba(79, 209, 197, 0.12);
        border-radius: 8px;
        overflow: hidden;
        animation: frameIn 700ms cubic-bezier(0.2, 0.8, 0.2, 1) both;
      }
      @keyframes frameIn {
        from {
          opacity: 0;
          transform: translateY(16px) scale(0.985);
        }
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }
      #app canvas {
        display: block;
        width: 100% !important;
        height: 100% !important;
      }
      .corner-gif {
        position: absolute;
        z-index: 3;
        width: 56px;
        height: 56px;
        opacity: 0.7;
        pointer-events: none;
        image-rendering: pixelated;
      }
      .corner-gif.tl {
        left: max(12px, calc(50% - 500px));
        top: 14px;
      }
      .corner-gif.br {
        right: max(12px, calc(50% - 500px));
        bottom: 14px;
      }
    </style>
  </head>
  <body>
    <div class="stage">
      <div class="orb a"></div>
      <div class="orb b"></div>
      <div class="orb c"></div>
      <div class="motes" aria-hidden="true"></div>
      <img class="corner-gif tl" src="assets/ui/fx_xp_orb.gif" alt="" />
      <img class="corner-gif br" src="assets/ui/fx_sparkle.gif" alt="" />
      <div id="app"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
